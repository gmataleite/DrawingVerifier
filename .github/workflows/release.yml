name: WPF CD Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine Version and Tag
        id: versioning
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
              $version = $tag.TrimStart('v')
              Write-Host "Triggered by tag push: $tag (version $version)"
              Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
              Write-Output "SKIP_RELEASE=false" >> $env:GITHUB_ENV
          } else {
              [xml]$props = Get-Content Directory.Build.props
              $version = $props.Project.PropertyGroup.Version.Trim()
              $tag = "v$version"
              Write-Host "Detected version from Directory.Build.props: $version (tag $tag)"
              Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

              $tagExists = git tag -l $tag
              if ($tagExists -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
                  Write-Host "Tag $tag already exists in repository. Skipping release creation."
                  Write-Output "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              } else {
                  Write-Host "New version $version detected. Proceeding with release $tag."
                  Write-Output "SKIP_RELEASE=false" >> $env:GITHUB_ENV
              }
          }

      - name: Publish WPF application
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet publish src/DrawingVerifier.UI/DrawingVerifier.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -o ./publish

          Compress-Archive -Path ./publish/DrawingVerifier.UI.exe -DestinationPath "./publish/DrawingVerifier-win-x64-$($env:RELEASE_TAG).zip"

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: |
            ./publish/*.exe
            ./publish/*.zip
          generate_release_notes: true
